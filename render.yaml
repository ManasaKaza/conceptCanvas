services:
  - type: web
    name: conceptcanvas-api
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: staging
      - key: HISTORY_ENABLED
        value: "false"
      - key: REQUESTS_PER_MINUTE
        value: "20"
      - key: MAX_REQUEST_BYTES
        value: "250000"
      - key: USE_AI
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: AI_REPAIR_ENABLED
        value: "true"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROUNDING_PROVIDER
        value: catalog
      - key: GROUNDING_CATALOG_PATH
        value: grounding/source_catalog.json
      - key: GROUNDING_MAX_CLAIMS
        value: "18"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
